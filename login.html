<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — NAQClinixAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background:linear-gradient(135deg,#0b1220,#1e3a8a 60%,#0d9488)">

<div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">
  <div class="text-center mb-6">
    <div class="text-5xl mb-2">🦷</div>
    <h1 class="text-2xl font-extrabold text-blue-900">NAQClinixAI</h1>
    <p class="text-sm text-gray-500 mt-1">تسجيل الدخول</p>
  </div>

  <div class="space-y-3">
    <div>
      <label class="text-xs font-bold text-gray-700 block mb-1">📧 الإيميل</label>
      <input type="email" id="email" placeholder="you@example.com" dir="ltr"
        class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-600">
    </div>
    <div>
      <label class="text-xs font-bold text-gray-700 block mb-1">🔒 كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')doLogin()"
        class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-600">
    </div>

    <button onclick="doLogin()" id="loginBtn"
      class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-3 rounded-xl font-bold hover:opacity-90 disabled:opacity-50">
      🔓 دخول
    </button>

    <div class="flex items-center gap-2 my-3">
      <div class="flex-1 h-px bg-gray-300"></div>
      <span class="text-xs text-gray-500">أو</span>
      <div class="flex-1 h-px bg-gray-300"></div>
    </div>

    <button onclick="doGoogleLogin()" id="googleBtn"
      class="w-full bg-white border-2 border-gray-300 text-gray-700 p-3 rounded-xl font-bold hover:bg-gray-50 flex items-center justify-center gap-2">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      دخول بجوجل
    </button>

    <p id="msg" class="hidden text-xs text-center p-2 rounded-lg font-bold"></p>

    <div class="text-center pt-3 border-t text-sm">
      <p class="text-gray-600">ليس لديك حساب؟
        <a href="register.html" class="text-blue-600 font-bold hover:underline">سجّل الآن</a>
      </p>
      <p class="mt-2">
        <a href="#" onclick="resetPassword(event)" class="text-xs text-gray-500 hover:text-blue-600">نسيت كلمة المرور؟</a>
      </p>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBe5PoeoH0pJ9hC0vTjVPELNZPpmKqCjCU",
  authDomain: "naqclinixai-dental-clinic.firebaseapp.com",
  projectId: "naqclinixai-dental-clinic",
  storageBucket: "naqclinixai-dental-clinic.firebasestorage.app",
  messagingSenderId: "796796158387",
  appId: "1:796796158387:web:613eac60fa6bc18e60cbc6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  if (!email || !password) { showMsg('⚠️ املأ الحقول', 'error'); return; }
  btn.disabled = true; btn.textContent = '⏳...';
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    if (!cred.user.emailVerified) {
      await cred.user.sendEmailVerification();
      window.location.href = 'verify-email.html';
      return;
    }
    window.location.href = 'layout.html';
  } catch (e) {
    showMsg('❌ ' + translateErr(e.code), 'error');
    btn.disabled = false; btn.textContent = '🔓 دخول';
  }
}

async function doGoogleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const cred = await auth.signInWithPopup(provider);
    // إنشاء وثيقة المستخدم إن لم تكن موجودة
    const userRef = db.collection('users').doc(cred.user.uid);
    const doc = await userRef.get();
    if (!doc.exists) {
      await userRef.set({
        uid: cred.user.uid,
        email: cred.user.email,
        name: cred.user.displayName || '',
        photoURL: cred.user.photoURL || '',
        role: 'patient',
        verified: true,
        active: true,
        createdAt: new Date(),
        authProvider: 'google'
      });
    }
    window.location.href = 'layout.html';
  } catch (e) {
    showMsg('❌ ' + translateErr(e.code), 'error');
  }
}

async function resetPassword(ev) {
  ev.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) { showMsg('⚠️ أدخل إيميلك أولاً', 'error'); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    showMsg('✅ تم إرسال رابط الاستعادة إلى إيميلك', 'success');
  } catch (e) {
    showMsg('❌ ' + translateErr(e.code), 'error');
  }
}

function translateErr(code) {
  const map = {
    'auth/user-not-found':'الإيميل غير مسجل',
    'auth/wrong-password':'كلمة المرور خطأ',
    'auth/invalid-email':'الإيميل غير صالح',
    'auth/too-many-requests':'محاولات كثيرة - انتظر دقيقة',
    'auth/popup-closed-by-user':'أُغلق نافذة جوجل قبل الإكمال',
    'auth/unauthorized-domain':'النطاق غير مصرح به في Firebase'
  };
  return map[code] || code;
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'text-xs text-center p-2 rounded-lg font-bold ' +
    (type==='error' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-700');
}

// تحويل تلقائي إن كان مسجل دخول مسبقاً
auth.onAuthStateChanged(u => {
  if (u && u.emailVerified) window.location.href = 'layout.html';
});
</script>
</body>
</html>
