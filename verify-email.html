<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحقق من إيميلك — NAQClinixAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background:linear-gradient(135deg,#0b1220,#1e3a8a 60%,#0d9488)">

<div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 text-center">
  <div class="text-6xl mb-3">📧</div>
  <h1 class="text-2xl font-extrabold text-blue-900">تحقق من إيميلك</h1>
  <p class="text-sm text-gray-600 mt-3 leading-relaxed">
    أرسلنا رابط تحقق إلى:<br>
    <strong id="emailLabel" class="text-blue-700"></strong>
  </p>
  <p class="text-xs text-gray-500 mt-3">
    افتح إيميلك → اضغط الرابط → ثم اضغط "تحققت" أدناه
  </p>

  <div class="space-y-3 mt-6">
    <button onclick="checkVerified()" id="checkBtn"
      class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-3 rounded-xl font-bold hover:opacity-90">
      ✅ لقد تحققت
    </button>
    <button onclick="resend()" class="w-full bg-gray-100 text-gray-700 p-3 rounded-xl font-bold hover:bg-gray-200 text-sm">
      📤 إعادة إرسال الرابط
    </button>
    <button onclick="logout()" class="text-xs text-gray-500 hover:text-red-600">
      🚪 تسجيل خروج
    </button>
  </div>

  <p id="msg" class="hidden text-xs text-center p-2 rounded-lg font-bold mt-3"></p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBe5PoeoH0pJ9hC0vTjVPELNZPpmKqCjCU",
  authDomain: "naqclinixai-dental-clinic.firebaseapp.com",
  projectId: "naqclinixai-dental-clinic",
  storageBucket: "naqclinixai-dental-clinic.firebasestorage.app",
  messagingSenderId: "796796158387",
  appId: "1:796796158387:web:613eac60fa6bc18e60cbc6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(u => {
  if (!u) { window.location.href = 'login.html'; return; }
  document.getElementById('emailLabel').textContent = u.email;
  if (u.emailVerified) {
    // تحديث وثيقة المستخدم
    firebase.firestore().collection('users').doc(u.uid).update({ verified: true }).catch(()=>{});
    window.location.href = 'layout.html';
  }
});

async function checkVerified() {
  const u = auth.currentUser;
  if (!u) return;
  await u.reload();
  if (u.emailVerified) {
    await firebase.firestore().collection('users').doc(u.uid).update({ verified: true }).catch(()=>{});
    window.location.href = 'layout.html';
  } else {
    showMsg('⚠️ لم يتم التحقق بعد - افتح الرابط في إيميلك', 'error');
  }
}

async function resend() {
  const u = auth.currentUser;
  if (!u) return;
  try {
    await u.sendEmailVerification();
    showMsg('✅ تم إرسال رابط جديد', 'success');
  } catch (e) {
    showMsg('❌ ' + e.message, 'error');
  }
}

async function logout() {
  await auth.signOut();
  window.location.href = 'login.html';
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'text-xs text-center p-2 rounded-lg font-bold ' +
    (type==='error' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-700');
}
</script>
</body>
</html>
