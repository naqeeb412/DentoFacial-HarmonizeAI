<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل جديد — NAQClinixAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-8" style="background:linear-gradient(135deg,#0b1220,#1e3a8a 60%,#0d9488)">

<div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">
  <div class="text-center mb-6">
    <div class="text-5xl mb-2">🦷</div>
    <h1 class="text-2xl font-extrabold text-blue-900">تسجيل جديد</h1>
    <p class="text-sm text-gray-500 mt-1">انضم إلى NAQClinixAI</p>
  </div>

  <div class="space-y-3">
    <div>
      <label class="text-xs font-bold text-gray-700 block mb-1">👤 الاسم الكامل *</label>
      <input type="text" id="fullName" placeholder="د. أحمد محمد"
        class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-600">
    </div>
    <div>
      <label class="text-xs font-bold text-gray-700 block mb-1">📧 الإيميل *</label>
      <input type="email" id="email" placeholder="you@example.com" dir="ltr"
        class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-600">
    </div>
    <div>
      <label class="text-xs font-bold text-gray-700 block mb-1">📱 الهاتف</label>
      <input type="tel" id="phone" placeholder="777xxxxxx" dir="ltr"
        class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-600">
    </div>
    <div>
      <label class="text-xs font-bold text-gray-700 block mb-1">🎯 نوع الحساب *</label>
      <select id="role"
        class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-600">
        <option value="patient">🧑‍🦱 مريض</option>
        <option value="doctor">👨‍⚕️ طبيب أسنان</option>
        <option value="lab">🔬 مختبر أسنان</option>
      </select>
    </div>
    <div>
      <label class="text-xs font-bold text-gray-700 block mb-1">🔒 كلمة المرور * (6+)</label>
      <input type="password" id="password" placeholder="••••••••"
        class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-600">
    </div>
    <div>
      <label class="text-xs font-bold text-gray-700 block mb-1">🔒 تأكيد كلمة المرور *</label>
      <input type="password" id="password2" placeholder="••••••••"
        class="w-full p-3 border-2 border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-600">
    </div>

    <label class="flex items-start gap-2 text-xs text-gray-600 cursor-pointer">
      <input type="checkbox" id="agree" class="mt-0.5">
      <span>أوافق على الشروط وسياسة الخصوصية</span>
    </label>

    <button onclick="doRegister()" id="regBtn"
      class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-3 rounded-xl font-bold hover:opacity-90 disabled:opacity-50">
      ✨ إنشاء الحساب
    </button>

    <p id="msg" class="hidden text-xs text-center p-2 rounded-lg font-bold"></p>

    <div class="text-center pt-3 border-t text-sm">
      <p class="text-gray-600">لديك حساب؟
        <a href="login.html" class="text-blue-600 font-bold hover:underline">سجّل دخول</a>
      </p>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBe5PoeoH0pJ9hC0vTjVPELNZPpmKqCjCU",
  authDomain: "naqclinixai-dental-clinic.firebaseapp.com",
  projectId: "naqclinixai-dental-clinic",
  storageBucket: "naqclinixai-dental-clinic.firebasestorage.app",
  messagingSenderId: "796796158387",
  appId: "1:796796158387:web:613eac60fa6bc18e60cbc6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

async function doRegister() {
  const fullName = document.getElementById('fullName').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const role = document.getElementById('role').value;
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const agree = document.getElementById('agree').checked;
  const btn = document.getElementById('regBtn');

  if (!fullName || !email || !password) { showMsg('⚠️ املأ الحقول المطلوبة', 'error'); return; }
  if (password.length < 6) { showMsg('⚠️ كلمة المرور 6 أحرف على الأقل', 'error'); return; }
  if (password !== password2) { showMsg('⚠️ كلمتا المرور غير متطابقتين', 'error'); return; }
  if (!agree) { showMsg('⚠️ وافق على الشروط', 'error'); return; }

  btn.disabled = true; btn.textContent = '⏳...';

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: fullName });

    await db.collection('users').doc(cred.user.uid).set({
      uid: cred.user.uid,
      email: email,
      name: fullName,
      phone: phone,
      role: role,
      photoURL: '',
      bio: '',
      country: '',
      specialty: '',
      verified: false,
      active: true,
      subscription: { planId: null, startDate: null, endDate: null, active: false },
      privacy: { showEmail: false, showPhone: false, allowMessages: true },
      createdAt: new Date(),
      authProvider: 'email'
    });

    await cred.user.sendEmailVerification();
    window.location.href = 'verify-email.html';
  } catch (e) {
    showMsg('❌ ' + translateErr(e.code), 'error');
    btn.disabled = false; btn.textContent = '✨ إنشاء الحساب';
  }
}

function translateErr(code) {
  const map = {
    'auth/email-already-in-use':'الإيميل مسجل مسبقاً',
    'auth/invalid-email':'الإيميل غير صالح',
    'auth/weak-password':'كلمة المرور ضعيفة'
  };
  return map[code] || code;
}

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'text-xs text-center p-2 rounded-lg font-bold ' +
    (type==='error' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-700');
}
</script>
</body>
</html>
